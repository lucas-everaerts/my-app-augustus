apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: myapp
  namespace: dev
spec:
  replicas: 4

  selector:
    matchLabels:
      app: myapp

  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
        - name: myapp
          image: myapp:dev
          imagePullPolicy: Never
          ports:
            - containerPort: 8080

  strategy:
    canary:
      steps:
        - setWeight: 25
        - pause:
            duration: 10
        - setWeight: 50
        - pause:
            duration: 10
        - setWeight: 75
        - pause:
            duration: 10
        - setWeight: 100